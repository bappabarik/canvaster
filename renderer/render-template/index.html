<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDP Renderer</title>

  <!--
    Fabric.js is loaded from the local node_modules so the renderer
    works fully offline and version is locked to what the editor uses.
    Puppeteer sets a custom protocol handler so file:// and
    __dirname-relative paths both work.
  -->
  <script src="./fabric.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      /* Size is set dynamically by initCanvas() below */
      background: transparent;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    // ── Renderer API ───────────────────────────────────────────────────────────
    // Puppeteer calls window.renderRow(job) and awaits window.__bdpDone.
    // On success:  window.__bdpDone = { ok: true }
    // On failure:  window.__bdpDone = { ok: false, error: '...' }

    window.__bdpDone = null;

    /**
     * Main entry point called by Puppeteer after page load.
     *
     * @param {Object} job
     * @param {string} job.canvasJson          - Fabric.js serialized canvas
     * @param {Object} job.resolvedData        - { placeholder: value } for this row
     * @param {number} job.width               - Canvas width in px
     * @param {number} job.height              - Canvas height in px
     * @param {Object} job.imageMap            - { filename: cloudinaryUrl } for photo placeholders
     */
    window.renderRow = async function(job) {
      try {
        const { canvasJson, resolvedData, width, height, imageMap = {} } = job;

        // 1. Size the page exactly to canvas dimensions
        document.documentElement.style.width  = width  + 'px';
        document.documentElement.style.height = height + 'px';
        document.body.style.width  = width  + 'px';
        document.body.style.height = height + 'px';

        // 2. Create the Fabric canvas
        const canvasEl = document.getElementById('c');
        canvasEl.width  = width;
        canvasEl.height = height;

        const fabricCanvas = new fabric.Canvas('c', {
          width,
          height,
          renderOnAddRemove: false,
          selection: false,
          skipTargetFind: true,
        });

        // Expose for debug inspection from Node
        window.__bdpFabricCanvas = fabricCanvas;

        // 3. Load canvas JSON
        console.log('[bdp] Loading canvas JSON, length:', canvasJson.length);
        await new Promise((resolve, reject) => {
          try {
            fabricCanvas.loadFromJSON(canvasJson, () => {
              console.log('[bdp] loadFromJSON complete, objects:', fabricCanvas.getObjects().length);
              resolve();
            }, (o, obj) => {
              if (!obj) console.warn('[bdp] Failed to deserialize one object:', JSON.stringify(o));
            });
          } catch (e) {
            reject(new Error('loadFromJSON threw: ' + (e && e.message ? e.message : String(e))));
          }
        });

        // 4. Walk every object and substitute placeholders
        const objects = fabricCanvas.getObjects();
        const placeholderRe = /\{([a-zA-Z_][a-zA-Z0-9_]*)\}/g;

        for (const obj of objects) {
          // ── Text objects: replace {placeholder} tokens in text ──────────────
          if (obj.type === 'textbox' || obj.type === 'text' || obj.type === 'i-text') {
            const original = obj.text || '';
            const replaced = original.replace(placeholderRe, (_, key) => {
              return key in resolvedData ? (resolvedData[key] ?? '') : `{${key}}`;
            });
            if (replaced !== original) {
              obj.set('text', replaced);
            }
          }

          // ── Image objects: replace {placeholder} src with Cloudinary URL ───
          if (obj.type === 'image') {
            const src = obj.getSrc ? obj.getSrc() : (obj._element && obj._element.src) || '';
            const match = src.match(/^\{([a-zA-Z_][a-zA-Z0-9_]*)\}$/);

            if (match) {
              const key = match[1];
              let imageUrl = null;

              const val = resolvedData[key] || '';

              // Direct URL in the CSV value
              if (val.startsWith('http')) {
                imageUrl = val;
              }
              // Filename → look it up in the imageMap built by Node
              else if (val && imageMap[val]) {
                imageUrl = imageMap[val];
              }

              if (imageUrl) {
                await new Promise((resolve) => {
                  fabric.Image.fromURL(imageUrl, (img) => {
                    if (!img) { resolve(); return; }

                    img.set({
                      left:    obj.left,
                      top:     obj.top,
                      scaleX:  obj.scaleX,
                      scaleY:  obj.scaleY,
                      angle:   obj.angle,
                      originX: obj.originX,
                      originY: obj.originY,
                    });

                    if (obj.width && obj.height) {
                      const scaleX = (obj.width  * obj.scaleX) / img.width;
                      const scaleY = (obj.height * obj.scaleY) / img.height;
                      const scale  = Math.max(scaleX, scaleY);
                      img.set({ scaleX: scale, scaleY: scale });
                    }

                    const idx = fabricCanvas.getObjects().indexOf(obj);
                    fabricCanvas.remove(obj);
                    fabricCanvas.insertAt(img, idx);
                    resolve();
                  }, { crossOrigin: 'anonymous' });
                });
              }
            }
          }
        }

        // 5. Render the canvas
        console.log('[bdp] Calling renderAll, objects:', fabricCanvas.getObjects().length);
        fabricCanvas.renderAll();

        // 6. Signal success
        window.__bdpDone = { ok: true };

      } catch (err) {
        const msg = (err && err.message) ? err.message : String(err);
        window.__bdpDone = { ok: false, error: msg };
      }
    };
  </script>
</body>
</html>
