<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BDP Renderer</title>

    <script src="./fabric.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        overflow: hidden;
        background: transparent;
      }

      canvas {
        display: block;
      }
    </style>
  </head>

  <body>
    <canvas id="c"></canvas>

    <script>
      window.__bdpDone = null;
      window.__bdpFabricCanvas = null;

      const BLANK_PNG =
        "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==";

      // ─────────────────────────────────────────────
      // PATCH PLACEHOLDER JSON
      // ─────────────────────────────────────────────
      function patchJson(json) {
        return json.replace(
          /"src"\s*:\s*"(\{[a-zA-Z_][a-zA-Z0-9_]*\})"/g,
          (_, ph) =>
            `"src":"${BLANK_PNG}","_placeholderSrc":"${ph}"`
        );
      }

      // ─────────────────────────────────────────────
      // LOAD IMAGE
      // ─────────────────────────────────────────────
      function loadImage(url) {
        return new Promise((resolve) => {
          fabric.Image.fromURL(
            url,
            (img) => resolve(img || null),
            {
              crossOrigin: "anonymous",
            }
          );
        });
      }

      // ─────────────────────────────────────────────
      // RESOLVE IMAGE URL
      // ─────────────────────────────────────────────
      function resolveImageUrl(key, resolvedData, imageMap) {
        const val = String(resolvedData[key] || "");

        if (
          val.startsWith("http://") ||
          val.startsWith("https://")
        ) {
          return val;
        }

        if (val && imageMap[val]) {
          return imageMap[val];
        }

        return null;
      }

      // ─────────────────────────────────────────────
      // IMAGE SWAP
      // ─────────────────────────────────────────────
      async function swapImage(
        fabricCanvas,
        targetObj,
        imageUrl,
        bounds
      ) {
        const img = await loadImage(imageUrl);

        if (!img) {
          console.warn("[bdp] Failed image:", imageUrl);
          return;
        }

        // CONTAIN FIT
        const scaleX = bounds.width / img.width;
        const scaleY = bounds.height / img.height;

        const scale = Math.min(scaleX, scaleY);

        const scaledW = img.width * scale;
        const scaledH = img.height * scale;

        img.set({
          left:
            bounds.left +
            (bounds.width - scaledW) / 2,

          top:
            bounds.top +
            (bounds.height - scaledH) / 2,

          scaleX: scale,
          scaleY: scale,

          originX: "left",
          originY: "top",

          selectable: false,
          evented: false,

          objectCaching: false,
          imageSmoothing: true,
          dirty: true,

          opacity:
            targetObj.opacity !== undefined
              ? targetObj.opacity
              : 1,
        });

        const idx = fabricCanvas
          .getObjects()
          .indexOf(targetObj);

        fabricCanvas.remove(targetObj);

        fabricCanvas.insertAt(
          img,
          idx >= 0
            ? idx
            : fabricCanvas.getObjects().length,
          false
        );
      }

      // ─────────────────────────────────────────────
      // MAIN RENDER
      // ─────────────────────────────────────────────
      window.renderRow = async function (job) {
        try {
          const {
            canvasJson,
            resolvedData,
            width,
            height,
            imageMap = {},
          } = job;

          // FIX PAGE SIZE
          document.documentElement.style.width =
            width + "px";

          document.documentElement.style.height =
            height + "px";

          document.body.style.width =
            width + "px";

          document.body.style.height =
            height + "px";

          // FIX CANVAS
          const canvasEl =
            document.getElementById("c");

          canvasEl.width = width;
          canvasEl.height = height;

          // IMPORTANT:
          // DO NOT APPLY CSS WIDTH/HEIGHT
          // OTHERWISE BROWSER SCALES IT

          const patched = patchJson(canvasJson);

          // STATIC CANVAS = SHARP EXPORTS
          const fc = new fabric.StaticCanvas("c", {
            width,
            height,

            renderOnAddRemove: false,

            selection: false,

            enableRetinaScaling: true,

            imageSmoothingEnabled: true,

            preserveObjectStacking: true,
          });

          window.__bdpFabricCanvas = fc;

          // LOAD TEMPLATE
          await new Promise((resolve) => {
            fc.loadFromJSON(patched, resolve);
          });

          // ───────────────────────────
          // TEXT REPLACEMENTS
          // ───────────────────────────
          const textRe =
            /\{([a-zA-Z_][a-zA-Z0-9_]*)\}/g;

          const swaps = [];

          for (const obj of fc.getObjects()) {
            // TEXT
            if (
              obj.type === "textbox" ||
              obj.type === "text" ||
              obj.type === "i-text"
            ) {
              const original = obj.text || "";

              const replaced = original.replace(
                textRe,
                (_, key) =>
                  key in resolvedData
                    ? String(
                        resolvedData[key] ?? ""
                      )
                    : `{${key}}`
              );

              if (replaced !== original) {
                obj.set({
                  text: replaced,
                  dirty: true,
                });
              }

              obj.set({
                objectCaching: false,
              });
            }

            // IMAGE PLACEHOLDER
            if (obj.type === "image") {
              const ph =
                obj._placeholderSrc ||
                obj.get("_placeholderSrc") ||
                "";

              const keyMatch = ph.match(
                /^\{([a-zA-Z_][a-zA-Z0-9_]*)\}$/
              );

              if (!keyMatch) continue;

              const key = keyMatch[1];

              const imageUrl =
                resolveImageUrl(
                  key,
                  resolvedData,
                  imageMap
                );

              if (!imageUrl) continue;

              const bounds = {
                left: obj.left,

                top: obj.top,

                width:
                  (obj.width || 100) *
                  (obj.scaleX || 1),

                height:
                  (obj.height || 100) *
                  (obj.scaleY || 1),
              };

              swaps.push(
                swapImage(
                  fc,
                  obj,
                  imageUrl,
                  bounds
                )
              );
            }

            // GROUP PLACEHOLDER
            if (
              obj.type === "group" &&
              (
                obj._isImagePlaceholder ||
                obj._placeholderKey
              )
            ) {
              const key =
                obj._placeholderKey ||
                obj.get("_placeholderKey");

              if (!key) continue;

              const imageUrl =
                resolveImageUrl(
                  key,
                  resolvedData,
                  imageMap
                );

              if (!imageUrl) continue;

              const br =
                obj.getBoundingRect(true, true);

              swaps.push(
                swapImage(
                  fc,
                  obj,
                  imageUrl,
                  {
                    left: br.left,
                    top: br.top,
                    width: br.width,
                    height: br.height,
                  }
                )
              );
            }
          }

          // WAIT ALL IMAGES
          await Promise.all(swaps);

          // WAIT FONTS
          await document.fonts.ready;

          // FORCE FULL RENDER
          fc.renderAll();

          await new Promise((resolve) =>
            requestAnimationFrame(resolve)
          );

          window.__bdpDone = {
            ok: true,
          };

        } catch (err) {
          console.error(err);

          window.__bdpDone = {
            ok: false,
            error:
              err?.message || String(err),
          };
        }
      };

      // ─────────────────────────────────────────────
      // REAL HD EXPORT
      // ─────────────────────────────────────────────
      window.exportCanvas = function () {
        const fc = window.__bdpFabricCanvas;

        return fc.toDataURL({
          format: "png",

          quality: 1,

          multiplier: 4,

          enableRetinaScaling: true,
        });
      };
    </script>
  </body>
</html>
